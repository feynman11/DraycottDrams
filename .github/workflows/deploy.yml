# Deploys the Worker (app + API) and applies D1 migrations first.
#   staging     every push to main            → draycottdrams-staging, D1 draycottdrams-staging
#   production  manual run on main (approval) → draycottdrams,         D1 draycottdrams
# Migrations run before the new code, so they must work with the code already live (add columns
# and tables; drop things only in a later release). Runtime secrets live in Cloudflare
# (`wrangler secret put`), never in GitHub; CI only holds the API token that deploys.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Account Settings:Read)
# and CLOUDFLARE_ACCOUNT_ID, and a GitHub environment `production` (add required reviewers there).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target || 'staging' }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          if [ "$TARGET" = staging ]; then export CLOUDFLARE_ENV=staging; fi
          pnpm build
      - name: Apply D1 migrations
        run: pnpm "db:migrate:$TARGET"
      - name: Deploy the Worker
        run: pnpm exec wrangler deploy --var "APP_VERSION:$GITHUB_SHA"
      - name: Smoke (the live Worker runs exactly this commit)
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          [ -n "$sub" ] && [ "$sub" != null ] || { echo "::error::no workers.dev subdomain"; exit 1; }
          name=draycottdrams; [ "$TARGET" = staging ] && name=draycottdrams-staging
          url="https://$name.$sub.workers.dev"
          get() { curl -fsS --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 "$1"; }
          get "$url/map" | grep -q '<div id="root">' # SPA fallback for a client route
          version=$(get "$url/api/health" | jq -r .version)
          [ "$version" = "$GITHUB_SHA" ] || { echo "::error::$url runs $version, expected $GITHUB_SHA"; exit 1; }
          echo "### $TARGET at \`$GITHUB_SHA\`: $url" >> "$GITHUB_STEP_SUMMARY"
